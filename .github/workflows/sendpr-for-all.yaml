name: Check Specific File Changes

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CHANGED: false

jobs:
  check-specific-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Changes in helm/crd/all.yaml
        id: check_changes
        run: |
          git fetch origin master
          if git --no-pager diff add-workspace..origin/master --name-only| grep -q "helm/crd/all.yaml"; then
            echo "File helm/crd/all.yaml was changed."
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "No changes in helm/crd/all.yaml."
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: Print Message
        if: env.CHANGED == 'true'
        run: |
          echo "echooo"
          echo "${{ env.CHANGED }}"
