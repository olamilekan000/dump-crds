name: Check Specific File Changes

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  check-specific-file:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.check_changes.outputs.changed }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Source Branch Name
        id: get_source_branch
        run: |
          if [[ $GITHUB_EVENT_NAME == "pull_request" ]]; then
            echo "SOURCE_BRANCH=${{ github.head_ref }}" >> $GITHUB_ENV
          elif [[ $GITHUB_EVENT_NAME == "push" ]]; then
            MERGE_COMMIT=$(git log -1 --merges --pretty=%H)
            SOURCE_BRANCH=$(git show -s --pretty=%B $MERGE_COMMIT | grep -oP '(?<=from )\S+' | sed 's/^[^/]*\///')
            echo "SOURCE_BRANCH=${SOURCE_BRANCH}" >> $GITHUB_ENV
          fi

      - name: Check for Changes in helm/crd/all.yaml
        id: check_changes
        run: |
          echo "Checking for changes between ${{ env.SOURCE_BRANCH }} and master"
          git fetch origin ${{ env.SOURCE_BRANCH }}
          if git --no-pager log -n 1 origin/${{ env.SOURCE_BRANCH }} --name-only --pretty=format: | grep -q "helm/crd/all.yaml"; then
            echo "File helm/crd/all.yaml was changed."
            echo "::set-output name=changed::true"
          else
            echo "No changes in helm/crd/all.yaml."
            echo "::set-output name=changed::false"
          fi

  process-changes:
    needs: check-specific-file
    runs-on: ubuntu-latest
    if: needs.check-specific-file.outputs.changed == 'true'

    steps:
      - name: Checkout other repository
        uses: actions/checkout@v4
        with: 
          repository: olamilekan000/leased-based-le
          token: ${{ secrets.PAT }}

      - name: Copy Helm chart to a temporary directory
        run: |
          mkdir -p /tmp/helm
          cp -r "${GITHUB_WORKSPACE}/helm/crd/all.yaml" /tmp/helm/charts-all.yaml

      - name: Upload Helm Chart
        uses: actions/upload-artifact@v4
        with:
          name: helm
          path: /tmp/helm

      - name: Create and checkout new branch
        run: |
          SHORT_UID=$(uuidgen | cut -c1-8)
          echo "SHORT_UID=$SHORT_UID" >> $GITHUB_ENV
          git checkout -b file-changed-${{ env.TAG }}-$SHORT_UID

      - name: Download Helm artifact directly into the component directory
        uses: actions/download-artifact@v4
        with:
          name: helm
          path: .

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "add new change to file version ${{ env.TAG }}-${{ env.SHORT_UID }}"
          git push origin file-changed-${{ env.TAG }}-${{ env.SHORT_UID }}

      - name: Create a pull request
        run: |
          gh pr create --base master --head file-changed-${{ env.TAG }}-${{ env.SHORT_UID }} \
            --title "Update Tyk Operator CRD for version file-changed-${{ env.TAG }}-${{ env.SHORT_UID }}" \
            --body "Changes include CRD updates from Tyk Operator for file-changed-${{ env.TAG }}-${{ env.SHORT_UID }}."
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
