name: Check Specific File Changes

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CHANGED: false

jobs:
  check-specific-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Source Branch
        id: source_branch
        run: |
          # For pull requests, use the source branch name
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "SOURCE_BRANCH=${{ github.head_ref }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "push" ]; then
            # For pushes directly to master, use the current branch name
            echo "SOURCE_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          fi
          
      - name: Check for Changes in helm/crd/all.yaml
        id: check_changes
        run: |
          git fetch origin master
          echo "Checking changes between ${GITHUB_REF} and master"
          if git --no-pager diff ${{ env.SOURCE_BRANCH }}..master --name-only | grep -q "helm/crd/all.yaml"; then
            echo "File helm/crd/all.yaml was changed."
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "No changes in helm/crd/all.yaml."
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: Print Message
        if: env.CHANGED == 'true'
        run: |
          echo "echooo"
          echo "${{ env.CHANGED }}"
